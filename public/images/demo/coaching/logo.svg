<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <!-- Background transparent -->
  
  <!-- Icon group -->
  <g transform="translate(15, 15)">
    <!-- Abstract Brain/Growth / Conversation -->
    <!-- Base Circle -->
    <circle cx="45" cy="45" r="40" fill="none" stroke="#1A237E" stroke-width="4" />
    
    <!-- Path representing growth/steps -->
    <path d="M25,60 L40,45 L55,55 L70,30" fill="none" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Arrow Head -->
    <path d="M60,30 L70,30 L70,40" fill="none" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Abstract Human Figure in center -->
    <circle cx="45" cy="30" r="10" fill="#1A237E" />
    <path d="M30,55 C30,45 60,45 60,55" fill="none" stroke="#1A237E" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Text -->
  <text x="120" y="65" font-family="'Merriweather', 'Georgia', serif" font-weight="900" font-size="36" fill="#1A237E">Expert Coaching</text>
  <text x="123" y="90" font-family="'Nunito', 'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#D4AF37" letter-spacing="3">BUSINESS &amp; CAREER</text>
</svg>
