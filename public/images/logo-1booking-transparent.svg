<svg width="600" height="130" viewBox="0 0 600 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0B9" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA771C" />
      <stop offset="50%" stop-color="#FBF0B9" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON (GOLD RING & CHECKMARK) -->
  <g transform="translate(15, 20)">
    <!-- Outer Ring -->
    <circle cx="45" cy="45" r="38" stroke="url(#goldGradient)" stroke-width="4.5" fill="none" />
    <!-- Center Dot -->
    <circle cx="45" cy="30" r="5" fill="url(#goldGradient)" />
    <!-- Checkmark / V curve -->
    <path d="M26 44 L39 58 L66 26" stroke="url(#goldGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- BRAND TEXT -->
  <text x="125" y="74" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="800" letter-spacing="1">
    <tspan fill="#FFFFFF">1Booking</tspan>
    <tspan fill="url(#goldGradient)">.Asia</tspan>
  </text>

  <!-- SUBTITLE -->
  <text x="128" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="4" fill="#C5A059" text-transform="uppercase">
    PREMIUM DIRECTORY &amp; SMART BOOKING
  </text>
  
  <!-- GOLD ACCENT DIVIDER -->
  <line x1="128" y1="108" x2="480" y2="108" stroke="url(#goldStroke)" stroke-width="1.5" stroke-opacity="0.6" />
</svg>